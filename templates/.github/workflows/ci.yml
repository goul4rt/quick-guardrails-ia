name: CI

# Gate de PR. Roda em todo PR (qualquer destino: task->feat/fix,
# feat/fix->master, hotfix->master, ...) e no push pra master.
# O build.yml continua sendo o pipeline de release (roda no release created).
#
# pull_request, NUNCA pull_request_target: o _target roda com secrets e escrita
# sobre código de fork — vetor de "pwn request" (doc 02). Na mesma linha: input
# de usuário (título de PR, branch) nunca interpolado em run: — sempre via env:.
on:
  pull_request:
  push:
    branches: [master]

# Só leitura; nenhum secret de produção toca este gate.
permissions:
  contents: read

# Cancela runs obsoletos SÓ em PR (push novo no mesmo PR mata o run do commit
# anterior). Em push na master não cancela: todo commit de mainline roda inteiro.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # step pendurado não segura o runner pelas 6h default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # commitlint precisa do range de commits do PR

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.14.0"
          cache: npm

      # Deps vêm todas do npm público (nenhum pacote resolve do GitHub Packages),
      # então npm ci puro basta — sem .npmrc/token. HUSKY=0: não roda git hooks no CI.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0

      # ---------- Checks — todos bloqueantes (falhou, travou o PR) ----------
      - name: Commitlint (padrão de commits do PR)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Lint (ESLint — 0 errors; warnings não bloqueiam)
        run: npm run lint:ci

      - name: DB schema em sync (drizzle-kit check)
        run: npx drizzle-kit check

      - name: Format (prettier — respeita .prettierignore)
        run: npx prettier --check .

      - name: Typecheck (tsc — 0 errors)
        run: npm run typecheck

      - name: Testes (jest)
        run: npm test -- --ci

      # Opcional (doc 14): cobertura medida nas linhas NOVAS do PR, não no repo
      # inteiro. Exige coverageReporters json no runner. Descomente para adotar.
      # - name: Cobertura no código novo
      #   if: github.event_name == 'pull_request'
      #   env:
      #     BASE: origin/${{ github.base_ref }}
      #   run: |
      #     npm test -- --ci --coverage --coverageReporters=json
      #     node scripts/diff-coverage.mjs "$BASE"

      # ---------- Resumo no PR ----------
      - name: Resumo do gate
        if: always()
        run: |
          {
            echo "## Gate de CI"
            echo ""
            echo "Todos os checks são **bloqueantes** — regressão em qualquer um trava o PR:"
            echo "commitlint · eslint · drizzle-check · prettier · tsc · jest."
          } >> "$GITHUB_STEP_SUMMARY"
