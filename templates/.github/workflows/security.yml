name: Security

# Camada determinística e BLOQUEANTE de segurança (ver docs/08-seguranca-no-gate.md).
# 100% free: gitleaks CLI (MIT) direto — sem o gitleaks-action, que a partir da
# v2 exige GITLEAKS_LICENSE em repositórios de organização.
# Complementa o audit.yml (vulnerabilidade de dependência, mensal).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # Secret no diff trava o PR. Determinístico (regex + entropia), falso
  # positivo raro — o caso perfeito para bloqueio. Exceção legítima vai
  # em .gitleaksignore com justificativa no commit, nunca desligando o job.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # varre o histórico — secret "removido" no commit seguinte ainda está lá

      # Versão pinada = scan reprodutível; bump é PR explícito (mesma regra
      # dos pins de dependência do doc 03).
      - name: Instala gitleaks (CLI, MIT — sem license key)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks

      - name: Scan de secrets (histórico completo)
        run: ./gitleaks git --redact --no-banner # exit 1 se achar secret → job falha
